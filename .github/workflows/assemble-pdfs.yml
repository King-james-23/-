name: Assemble PDFs
on:
  repository_dispatch:
    types: [assemble-pdfs]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pdf-assembly
          fetch-depth: 0
      - name: Concatenate and verify chunks
        run: |
          set -euo pipefail
          mkdir -p artifacts/pdfs
          cat .pdf-upload/zh/part-* > artifacts/pdfs/learn-harness-engineering-zh.pdf
          cat .pdf-upload/en/part-* > artifacts/pdfs/learn-harness-engineering-en.pdf
          test "$(stat -c%s artifacts/pdfs/learn-harness-engineering-zh.pdf)" = "15535410"
          test "$(stat -c%s artifacts/pdfs/learn-harness-engineering-en.pdf)" = "8092864"
      - name: Commit assembled PDFs
        run: |
          git config user.name "kdot"
          git config user.email "King-james-23@users.noreply.github.com"
          git add artifacts/pdfs/*.pdf
          git commit -m "Assemble course PDFs from uploaded chunks"
          git push origin HEAD:codex/pdf-assembly